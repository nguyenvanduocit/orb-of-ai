# Orb Of AI on Fly.io — single machine (a Discord gateway bot on two machines
# would answer everything twice), volume-backed data/, HTTP server on :8080.
app = "orb-of-ai"
primary_region = "sin"

swap_size_mb = 512

[env]
  PORT = "8080"
  # Claude CLI transcripts on the volume so channel sessions survive redeploys
  # (agent.ts whitelists this var through to the CLI subprocess).
  CLAUDE_CONFIG_DIR = "/app/data/.claude"

[mounts]
  source = "orb_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
